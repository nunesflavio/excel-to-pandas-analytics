[project]
name = "excel-to-pandas-analytics"
version = "0.1.0"
description = ""
authors = [
    {name = "nunesflavio",email = "pnunesflavio@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "notebook (>=7.6.4,<8.0.0)",
    "pandas-stubs (>=3.1.0,<3.2.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]

[tool.poetry]
packages = [{include = "excel-to-pandas-analytics", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
